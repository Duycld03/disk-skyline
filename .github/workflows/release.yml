name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: disk-skyline
            gui_binary: disk-skyline-gui
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: disk-skyline
            gui_binary: ""
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: disk-skyline.exe
            gui_binary: disk-skyline-gui.exe
            archive_ext: zip
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: disk-skyline
            gui_binary: disk-skyline-gui
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: disk-skyline
            gui_binary: disk-skyline-gui
            archive_ext: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev

      - name: Install musl tools (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            cargo build --release --target ${{ matrix.target }} --bin disk-skyline
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package archive (Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          ARCHIVE_NAME="disk-skyline-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          FILES=("${{ matrix.binary_name }}")
          if [ -n "${{ matrix.gui_binary }}" ] && [ -f "target/${{ matrix.target }}/release/${{ matrix.gui_binary }}" ]; then
            FILES+=("${{ matrix.gui_binary }}")
          fi
          tar -czf "$ARCHIVE_NAME" \
            -C "target/${{ matrix.target }}/release" "${FILES[@]}" \
            -C "${{ github.workspace }}" README.md LICENSE
          sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          echo "ARCHIVE_PATH=$ARCHIVE_NAME" >> $GITHUB_ENV
          echo "CHECKSUM_PATH=${ARCHIVE_NAME}.sha256" >> $GITHUB_ENV
      - name: Package archive (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $ArchiveName = "disk-skyline-${{ github.ref_name }}-${{ matrix.target }}.zip"
          $Files = @("target/${{ matrix.target }}/release/${{ matrix.binary_name }}")
          if ("${{ matrix.gui_binary }}" -and (Test-Path "target/${{ matrix.target }}/release/${{ matrix.gui_binary }}")) {
            $Files += "target/${{ matrix.target }}/release/${{ matrix.gui_binary }}"
          }
          $Files += "README.md", "LICENSE"
          Compress-Archive -Path $Files -DestinationPath $ArchiveName
          $Hash = (Get-FileHash -Path $ArchiveName -Algorithm SHA256).Hash.ToLower()
          "$Hash  $ArchiveName" | Out-File -Encoding ascii "${ArchiveName}.sha256"
          echo "ARCHIVE_PATH=$ArchiveName" >> $env:GITHUB_ENV
          echo "CHECKSUM_PATH=${ArchiveName}.sha256" >> $env:GITHUB_ENV
      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE_PATH }}
            ${{ env.CHECKSUM_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
