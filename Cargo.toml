[package]
name = "disk-skyline"
version = "0.1.0"
edition = "2021"
description = "Interactive 2D Disk Skyline & TUI Visualizer in Rust"
authors = ["Duycld03"]
license = "MIT"
repository = "https://github.com/Duycld03/disk-skyline"
readme = "README.md"
keywords = ["disk-usage", "tui", "ratatui", "visualization", "cli"]
categories = ["command-line-utilities", "visualization"]
[dependencies]
ratatui = "0.28"
crossterm = "0.28"
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
rayon = "1.10"
